<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- WhatsApp Official Vibrant Green Gradient -->
    <linearGradient id="wa-bg-grad" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="45%" stop-color="#128C7E"/>
      <stop offset="100%" stop-color="#075E54"/>
    </linearGradient>

    <!-- Glowing Rim Light -->
    <linearGradient id="wa-rim-grad" x1="120" y1="40" x2="392" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DCF8C6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#25D366" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#054D44" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Center Play White/Mint Gradient -->
    <linearGradient id="wa-play-grad" x1="220" y1="180" x2="330" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E1FFC7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="wa-shadow" x="0" y="8" width="512" height="504" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#075E54" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Main Circular Badge with Shadow -->
  <circle cx="256" cy="248" r="216" fill="url(#wa-bg-grad)" filter="url(#wa-shadow)"/>
  <circle cx="256" cy="248" r="212" stroke="url(#wa-rim-grad)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Segmented WhatsApp Status Story Ring (4 Arcs) -->
  <!-- Arc 1: Top-Right -->
  <path d="M256 64 A184 184 0 0 1 440 248" stroke="#DCF8C6" stroke-width="12" stroke-linecap="round" stroke-dasharray="130 18" opacity="0.95"/>
  <!-- Arc 2: Bottom-Right -->
  <path d="M440 248 A184 184 0 0 1 256 432" stroke="#DCF8C6" stroke-width="12" stroke-linecap="round" stroke-dasharray="130 18" opacity="0.95"/>
  <!-- Arc 3: Bottom-Left -->
  <path d="M256 432 A184 184 0 0 1 72 248" stroke="#DCF8C6" stroke-width="12" stroke-linecap="round" stroke-dasharray="130 18" opacity="0.95"/>
  <!-- Arc 4: Top-Left -->
  <path d="M72 248 A184 184 0 0 1 256 64" stroke="#DCF8C6" stroke-width="12" stroke-linecap="round" stroke-dasharray="130 18" opacity="0.95"/>

  <!-- Center Frosted Glass Plate -->
  <circle cx="256" cy="248" r="132" fill="#FFFFFF" fill-opacity="0.14"/>
  <circle cx="256" cy="248" r="132" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.35"/>

  <!-- WhatsApp Chat Bubble Base Silhouette -->
  <path d="M256 138 C195.2 138 146 187.2 146 248 C146 270.4 152.6 291.2 164.2 308.8 L152 354 L198.8 341.8 C215.6 352.2 235.2 358 256 358 C316.8 358 366 308.8 366 248 C366 187.2 316.8 138 256 138 Z" fill="#075E54" fill-opacity="0.5"/>

  <!-- Dynamic Status Video Play Arrow inside Bubble -->
  <polygon points="230,192 316,248 230,304" fill="url(#wa-play-grad)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>

  <!-- Status Camera / Star Sparkle Badge at Top Right of Center -->
  <circle cx="330" cy="180" r="22" fill="#25D366" stroke="#FFFFFF" stroke-width="3.5"/>
  <!-- Play/Camera Dot -->
  <circle cx="330" cy="180" r="8" fill="#FFFFFF"/>
</svg>
