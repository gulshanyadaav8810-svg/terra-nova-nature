<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Glowing Segmented Story Ring Gradient (Vibrant Cyan to Neon Mint) -->
    <linearGradient id="circ-ring-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFE0"/>
      <stop offset="50%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Luxury Dark Disc Base -->
    <radialGradient id="circ-inner-disc" cx="44%" cy="44%" r="56%">
      <stop offset="0%" stop-color="#043224"/>
      <stop offset="55%" stop-color="#011811"/>
      <stop offset="100%" stop-color="#000603"/>
    </radialGradient>

    <!-- Chrome Rim Gradient -->
    <linearGradient id="circ-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#6EE7B7" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#047857" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Sweeping Nature Leaf Gradient -->
    <linearGradient id="circ-leaf-grad" x1="160" y1="120" x2="360" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="14%" stop-color="#D1FAE5"/>
      <stop offset="38%" stop-color="#34D399"/>
      <stop offset="72%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#023D2C"/>
    </linearGradient>

    <!-- Fresh Sprout Gradient -->
    <linearGradient id="circ-sprout-grad" x1="280" y1="120" x2="400" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="30%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="circ-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#00F5D4" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- MAIN LUXURY CIRCULAR BADGE (Pure Circle, No Rectangle!) -->
  <g filter="url(#circ-glow)">
    <!-- Outer Ambient Aura Ring -->
    <circle cx="256" cy="256" r="234" fill="none" stroke="url(#circ-ring-glow)" stroke-width="2.5" stroke-opacity="0.4"/>

    <!-- Segmented Status Story Ring (4 Rounded Arcs) -->
    <circle cx="256" cy="256" r="218" stroke="url(#circ-ring-glow)" stroke-width="12" stroke-linecap="round" stroke-dasharray="144 26" fill="none" opacity="0.95"/>

    <!-- Inner Core Disc -->
    <circle cx="256" cy="256" r="192" fill="url(#circ-inner-disc)"/>
    <circle cx="256" cy="256" r="192" fill="none" stroke="url(#circ-rim)" stroke-width="3"/>

    <!-- Subtle Inner Glass Circle -->
    <circle cx="256" cy="256" r="150" fill="#FFFFFF" fill-opacity="0.03" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- SWEEPING ORGANIC NATURE LEAF (Tilted dynamic curve) -->
    <path d="M174 324 C142 268 154 188 212 148 C270 108 338 128 354 148 C344 190 310 242 262 274 C218 304 186 328 174 324 Z" 
          fill="url(#circ-leaf-grad)" />
    
    <!-- Luminous Energy Spine of Leaf -->
    <path d="M186 314 C214 274 256 216 340 154" 
          stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.95"/>

    <!-- Companion Fresh Sprout Leaf -->
    <path d="M292 138 C342 126 384 162 378 210 C372 246 340 270 300 258 C294 222 314 166 292 138 Z" 
          fill="url(#circ-sprout-grad)" opacity="0.95"/>

    <!-- Morning Dewdrop Jewel on Leaf Crest -->
    <circle cx="348" cy="150" r="9.5" fill="#FFFFFF"/>
    <circle cx="346" cy="148" r="4.5" fill="#00FFE0"/>

    <!-- CENTRAL FLOATING PLAY BADGE DISC -->
    <circle cx="256" cy="256" r="68" fill="#011811" stroke="url(#circ-rim)" stroke-width="3"/>
    <circle cx="256" cy="256" r="64.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8"/>

    <!-- Pure White Precision Play Triangle -->
    <polygon points="238,220 294,256 238,292" 
             fill="#FFFFFF" 
             stroke="#FFFFFF" 
             stroke-width="3.5" 
             stroke-linejoin="round"/>

    <!-- Diamond Sparkle Stars -->
    <path d="M360 106 L363 97 L372 94 L363 91 L360 82 L357 91 L348 94 L357 97 Z" fill="#FDE68A"/>
    <path d="M136 344 L138 336 L146 334 L138 332 L136 324 L134 332 L126 334 L134 336 Z" fill="#00FFE0" opacity="0.9"/>
  </g>
</svg>