<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian Green Master Canvas (100% Full-Bleed, Zero White, Zero Transparency) -->
    <radialGradient id="nr-base" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#08382A"/>
      <stop offset="55%" stop-color="#031C13"/>
      <stop offset="100%" stop-color="#010C07"/>
    </radialGradient>

    <!-- Top-Left Luminous Neon Cyan Flare -->
    <radialGradient id="nr-glow-tl" cx="12%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#00FFE0" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#00D2A0" stop-opacity="0.35"/>
      <stop offset="75%" stop-color="#059669" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom-Right Vibrant Emerald-Mint Flare -->
    <radialGradient id="nr-glow-br" cx="88%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#047857" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Status Story Segmented Ring Gradient -->
    <linearGradient id="nr-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFE0"/>
      <stop offset="28%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Core Floating Circular Disc Gradient -->
    <radialGradient id="nr-core-disc" cx="44%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#0A4D38"/>
      <stop offset="45%" stop-color="#032418"/>
      <stop offset="100%" stop-color="#01100A"/>
    </radialGradient>

    <!-- Chrome Bezel Rim Gradient -->
    <linearGradient id="nr-rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#A7F3D0" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#059669" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Tilted Nature Leaf Hero Gradient -->
    <linearGradient id="nr-leaf-grad" x1="165" y1="125" x2="365" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="12%" stop-color="#E6FFFA"/>
      <stop offset="32%" stop-color="#34D399"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#023D2C"/>
    </linearGradient>

    <!-- Sprout Leaf Companion Gradient -->
    <linearGradient id="nr-sprout-grad" x1="285" y1="125" x2="400" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="35%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- 3D Shadow Filters (Soft, Luxurious Depth) -->
    <filter id="nr-emblem-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00FFE0" flood-opacity="0.35"/>
    </filter>

    <filter id="nr-play-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00FFE0" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 1. FULL-BLEED BACKGROUND (Fills all 512x512 pixels edge-to-edge, zero white) -->
  <rect width="512" height="512" fill="url(#nr-base)"/>
  <rect width="512" height="512" fill="url(#nr-glow-tl)"/>
  <rect width="512" height="512" fill="url(#nr-glow-br)"/>

  <!-- Subtle Ambient Ray Beams in Background -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#00FFE0" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- 2. ORGANIC TILTED NATURE EMBLEM (NO RECTANGLE! 100% Curved & Elegant) -->
  <g filter="url(#nr-emblem-shadow)">
    <!-- Ambient Halo Ring -->
    <circle cx="256" cy="256" r="236" fill="none" stroke="url(#nr-ring-grad)" stroke-width="2.5" stroke-opacity="0.5"/>

    <!-- High-Tech Segmented Story Status Ring (4 Curved Segments) -->
    <circle cx="256" cy="256" r="222" stroke="url(#nr-ring-grad)" stroke-width="13" stroke-linecap="round" stroke-dasharray="146 26" fill="none" opacity="0.98"/>

    <!-- Deep Luminous Circular Disc Core -->
    <circle cx="256" cy="256" r="196" fill="url(#nr-core-disc)"/>
    <circle cx="256" cy="256" r="196" fill="none" stroke="url(#nr-rim-grad)" stroke-width="3.2"/>

    <!-- Concentric Inner Water Ripple Ring -->
    <circle cx="256" cy="256" r="154" fill="#FFFFFF" fill-opacity="0.04" stroke="rgba(255,255,255,0.2)" stroke-width="1.6"/>

    <!-- TILTED SWEEPING NATURE LEAF (Organic, Flowing Arc) -->
    <path d="M170 330 C136 270 150 184 212 142 C272 100 344 122 360 142 C350 186 314 242 262 278 C214 310 182 334 170 330 Z" 
          fill="url(#nr-leaf-grad)"/>
    
    <!-- Luminous Spine of Nature Leaf -->
    <path d="M182 320 C214 276 260 212 346 148" 
          stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.95"/>

    <!-- Companion Fresh Sprout Petal -->
    <path d="M294 134 C348 122 392 158 386 210 C380 248 344 274 302 262 C296 224 316 164 294 134 Z" 
          fill="url(#nr-sprout-grad)" opacity="0.95"/>

    <!-- Morning Dewdrop Jewel on Leaf Crest -->
    <circle cx="354" cy="146" r="10" fill="#FFFFFF"/>
    <circle cx="352" cy="144" r="5" fill="#00FFE0"/>

    <!-- CIRCULAR Floating Play Badge (NO RECTANGLE, PURE ORGANIC CIRCLE!) -->
    <circle cx="256" cy="256" r="70" fill="#011811" stroke="url(#nr-rim-grad)" stroke-width="3.2" filter="url(#nr-play-shadow)"/>
    <circle cx="256" cy="256" r="66" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-opacity="0.85"/>

    <!-- Pure White Precision Play Triangle Inside Circle -->
    <polygon points="236,218 296,256 236,294" 
             fill="#FFFFFF" 
             stroke="#FFFFFF" 
             stroke-width="3.5" 
             stroke-linejoin="round"/>

    <!-- Subtle Twinkle Sparkles -->
    <path d="M364 102 L367 93 L376 90 L367 87 L364 78 L361 87 L352 90 L361 93 Z" fill="#FDE68A"/>
    <path d="M132 348 L134 340 L142 338 L134 336 L132 328 L130 336 L122 338 L130 340 Z" fill="#00FFE0" opacity="0.9"/>
  </g>
</svg>
