<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant Highlight Background Gradient (Electric Cyan & Neon Emerald) -->
    <linearGradient id="ns-hl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFE0"/>
      <stop offset="25%" stop-color="#00E5B3"/>
      <stop offset="55%" stop-color="#00D2A0"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#023D2C"/>
    </linearGradient>

    <!-- Deep Luxury Obsidian Core Disc -->
    <radialGradient id="ns-core-disc" cx="46%" cy="46%" r="56%">
      <stop offset="0%" stop-color="#03261C"/>
      <stop offset="65%" stop-color="#011811"/>
      <stop offset="100%" stop-color="#000704"/>
    </radialGradient>

    <!-- Chrome Rim Gradient -->
    <linearGradient id="ns-chrome-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#A7F3D0" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#059669" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Master Nature Leaf Gradient -->
    <linearGradient id="ns-leaf-hero" x1="170" y1="120" x2="355" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#D1FAE5"/>
      <stop offset="40%" stop-color="#34D399"/>
      <stop offset="75%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#023D2C"/>
    </linearGradient>

    <!-- Fresh Sprout Gradient -->
    <linearGradient id="ns-sprout-hero" x1="290" y1="130" x2="390" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="35%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Core Disc Drop Shadow -->
    <filter id="ns-disc-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#011F16" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Center Play Shadow -->
    <filter id="ns-play-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00FFE0" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 1. FULL-BLEED HIGHLIGHT BACKGROUND (Edge-to-edge, ZERO white borders!) -->
  <rect width="512" height="512" fill="url(#ns-hl-bg)"/>

  <!-- Luminous Ambient Light Glows -->
  <circle cx="80" cy="80" r="200" fill="#FFFFFF" opacity="0.32" filter="blur(36px)"/>
  <circle cx="430" cy="430" r="210" fill="#012419" opacity="0.48" filter="blur(36px)"/>

  <!-- 2. LUXURY DEEP OBSIDIAN CORE DISC -->
  <circle cx="256" cy="256" r="184" fill="url(#ns-core-disc)" filter="url(#ns-disc-shadow)"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#ns-chrome-rim)" stroke-width="3.2"/>

  <!-- 3. SEGMENTED STATUS STORY RING (Neon Cyan High-Tech Arcs) -->
  <circle cx="256" cy="256" r="160" stroke="#00FFE0" stroke-width="5" stroke-linecap="round" stroke-dasharray="100 26" fill="none" opacity="0.9"/>

  <!-- 4. HERO NATURE LEAF (Sweeping Arc) -->
  <path d="M178 326 C148 266 160 186 220 148 C278 110 346 132 360 152 C350 196 316 248 268 280 C224 310 192 332 178 326 Z" 
        fill="url(#ns-leaf-hero)" />
  
  <!-- Glowing White Vein/Spine -->
  <path d="M190 316 C218 276 262 216 344 154" 
        stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.95"/>

  <!-- Companion Sprout Leaf -->
  <path d="M296 140 C346 128 388 162 382 212 C376 248 344 274 304 262 C298 226 316 170 296 140 Z" 
        fill="url(#ns-sprout-hero)" opacity="0.95"/>

  <!-- Morning Dewdrop Jewel -->
  <circle cx="355" cy="150" r="9.5" fill="#FFFFFF"/>
  <circle cx="353" cy="148" r="4.5" fill="#00FFE0"/>

  <!-- 5. CENTRAL PLAY BADGE DISC -->
  <circle cx="256" cy="256" r="68" fill="#022B1E" stroke="url(#ns-chrome-rim)" stroke-width="3" filter="url(#ns-play-glow)"/>
  <circle cx="256" cy="256" r="64.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- Pure White Centered Play Triangle -->
  <polygon points="238,220 294,256 238,292" 
           fill="#FFFFFF" 
           stroke="#FFFFFF" 
           stroke-width="3.5" 
           stroke-linejoin="round"/>

  <!-- Sparkling Nature Diamonds -->
  <path d="M352 110 L355 101 L364 98 L355 95 L352 86 L349 95 L340 98 L349 101 Z" fill="#FDE68A"/>
  <path d="M142 342 L144 334 L152 332 L144 330 L142 322 L140 330 L132 332 L140 334 Z" fill="#00FFE0" opacity="0.9"/>
</svg>